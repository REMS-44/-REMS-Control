<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>REMS Control</title>
  <link rel="stylesheet" href="styles.css?v=11.0">

<style>
/* REMS Control v4.2 — Personal student schedules */
.student-schedules-page{display:grid;gap:18px}
.schedule-admin-note{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:18px 20px;border:1px solid #e2e5ea;border-radius:16px;background:#fff}
.schedule-admin-note b{font-size:15px}
.schedule-admin-note p{margin:5px 0 0;max-width:760px;color:#737b88;font-size:12px;line-height:1.55}
.schedule-admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.schedule-admin-card{border:1px solid #e2e5ea;border-radius:15px;background:#fff;padding:15px;display:grid;gap:12px}
.schedule-admin-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.schedule-admin-card h3{margin:0 0 3px;font-size:15px}
.schedule-admin-card span{color:#8a919d;font-size:10px}
.schedule-admin-card-top strong{font-size:24px;color:#111827}
.schedule-admin-next{min-height:34px;color:#606875;font-size:11px;line-height:1.5}
.schedule-admin-actions{display:flex;gap:7px;flex-wrap:wrap}
.schedule-admin-actions .ghost{font-size:10px;padding:8px 10px}
@media(max-width:1100px){.schedule-admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.schedule-admin-grid{grid-template-columns:1fr}.schedule-admin-note{align-items:flex-start;flex-direction:column}}
</style></head>

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">R</div>
      <div><strong>REMS Control</strong><span>Пульт зайнятості</span></div>
    </div>
    <nav>
      <button class="nav active" data-view="dashboard">⌂ <span>Головна</span></button>
      <button class="nav" data-view="students">👥 <span>Студенти</span></button>
      <button class="nav" data-view="projects">🎭 <span>Проєкти</span></button>
      <button class="nav" data-view="academic">🎓 <span>Розклад занять</span></button>
      <button class="nav" data-view="schedule">🧭 <span>Зайнятість</span></button>
      <button class="nav" data-view="industry">✦ <span>Зустріч із індустрією</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="mini" id="backupBtn">Експорт</button>
      <label class="mini file-btn">Імпорт<input id="restoreInput" type="file" accept=".json"></label>
      <div class="sidebar-note" id="cloudStatus">v11.0 · підключення…</div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div><h1 id="pageTitle">Головна</h1><p id="pageSubtitle">Навчальний рік 2026/27 · серпень–травень</p></div>
      <button class="primary" id="quickAdd" hidden></button>
    </header>
    <section id="app"></section>
  </main>

  <dialog id="projectDialog">
    <form method="dialog" id="projectForm">
      <h2>Новий проєкт</h2>
      <label>Назва<input id="projectName" required placeholder="Наприклад: Людина року"></label>
      <div class="split">
        <label>Колір<input id="projectColor" type="color" value="#2563EB"></label>
        <label>Позначка<input id="projectEmoji" maxlength="3" value="◆"></label>
      </div>
      <div class="dialog-actions"><button type="button" id="cancelProjectCreate" class="ghost">Скасувати</button><button type="button" class="primary" id="saveProject">Зберегти</button></div>
    </form>
  </dialog>

  <dialog id="eventDialog">
    <form method="dialog" id="eventForm">
      <h2>Додати дату</h2>
      <input type="hidden" id="eventProjectId">
      <label>Дата<input id="eventDate" type="date" required></label>
      <label>Тип<input id="eventType" required placeholder="Репетиція / зйомка / подія"></label>
      <div class="dialog-actions"><button type="button" id="cancelEventCreate" class="ghost">Скасувати</button><button type="button" class="primary" id="saveEvent">Додати</button></div>
    </form>
  </dialog>

  <dialog id="studentDialog" class="student-dialog">
    <div id="studentDialogBody"></div>
  </dialog>
