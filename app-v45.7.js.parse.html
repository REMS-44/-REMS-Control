">25+ вільних</option>\n        <option value="20">20+ вільних</option>\n      </select>\n      <button type="button" class="ghost" id="schMatrixBtn">Таблиця по студентах</button>\n    </div>\n    <div id="scheduleKpis" class="schedule-kpis"></div>\n    <div id="scheduleRecommended"></div>\n    <div id="scheduleMonthTabs" class="schedule-month-tabs"></div>\n    <div id="scheduleCalendar"></div>`;\n\n  const matrixBtn=document.querySelector("#schMatrixBtn");\n  if(matrixBtn) matrixBtn.onclick=()=>openScheduleMatrix();\n\n  const render=()=>{\n    const ranges={\n      august:["2026-08-01","2026-08-31"],\n      autumn:["2026-09-01","2026-11-30"],\n      winter:["2026-12-01","2027-02-28"],\n      spring:["2027-03-01","2027-05-31"],\n      year:["2026-08-01","2027-05-31"]\n    };\n    const [start,end]=ranges[$("#schPeriod").value];\n    const weekday=$("#schWeekday").value;\n    const minFree=+$("#schMinFree").value;\n    const group=$("#schGroup").value;\n    const poolStudents=db.students.filter(st=>!group||String(st.group||"")===group);\n    const poolIds=new Set(poolStudents.map(st=>String(st.id)));\n\n    const allDates=datesBetween(start,end);\n    const stats={};\n\n    allDates.forEach(date=>{\n      const busyIds=new Set();\n      const reasons={};\n\n      db.events.filter(e=>e.date===date).forEach(e=>{\n        const p=pBy(e.projectId);\n        if(!p) return;\n        const assigned=studentsForEvent(e).filter(st=>poolIds.has(String(st.id)));\n        assigned.forEach(st=>busyIds.add(String(st.id)));\n        if(assigned.length) reasons[p.name]=(reasons[p.name]||0)+assigned.length;\n      });\n\n\n      const busy=busyIds.size;\n      const free=Math.max(0,poolStudents.length-busy);\n      let cls="schedule-score-best",label="ІДЕАЛЬНО",dayClass="best";\n      if(busy>=15){cls="schedule-score-critical";label="КРИТИЧНО";dayClass="critical";}\n      else if(busy>=10){cls="schedule-score-hard";label="СКЛАДНО";dayClass="hard";}\n      else if(busy>=5){cls="schedule-score-good";label="МОЖНА";dayClass="";}\n\n      stats[date]={busy,free,reasons,cls,label,dayClass};\n    });\n\n    const filtered=allDates.filter(date=>{\n      const day=new Date(date+"T12:00:00").getDay();\n      if(day===0||day===6) return false;\n      if(weekday && String(day)!==weekday) return false;\n      return stats[date].free>=minFree;\n    });\n\n    const avgFree=filtered.length ? Math.round(filtered.reduce((s,d)=>s+stats[d].free,0)/filtered.length) : 0;\n    const perfect=filtered.filter(d=>stats[d].busy<=4).length;\n    const hard=filtered.filter(d=>stats[d].busy>=10&&stats[d].busy<15).length;\n    const critical=filtered.filter(d=>stats[d].busy>=15).length;\n\n    $("#scheduleKpis").innerHTML=`\n      <div class="schedule-kpi"><span>Студентів у вибірці</span><strong>${poolStudents.length}</strong></div>\n      <div class="schedule-kpi"><span>Середньо вільних від проєктів</span><strong>${avgFree}</strong></div>\n      <div class="schedule-kpi"><span>Ідеальних днів</span><strong>${perfect}</strong></div>\n      <div class="schedule-kpi"><span>Складних днів</span><strong>${hard}</strong></div>\n      <div class="schedule-kpi"><span>Критичних днів</span><strong>${critical}</strong></div>`;\n\n    const best=[...filtered].sort((a,b)=>stats[b].free-stats[a].free||a.localeCompare(b)).slice(0,5);\n    $("#scheduleRecommended").innerHTML=best.length?`\n      <div class="recommended-card">\n        <h2>Найвільніші від проєктів дні</h2>\n        <div class="recommended-list">\n          ${best.map(d=>{\n            const wd=new Date(d+"T12:00:00").toLocaleDateString("uk-UA",{weekday:"long"});\n            return `<button class="recommended-item schedule-open-day" data-date="${d}">\n              <b>${fullfmt(d)}</b><br>\n              <span class="schedule-note">${wd} · ${stats[d].free} вільних із ${poolStudents.length}</span>\n            </button>`;\n          }).join("")}\n        </div>\n      </div>`:"";\n\n    const monthGroups={};\n    allDates.forEach(d=>{\n      const key=d.slice(0,7);\n      (monthGroups[key] ||= []).push(d);\n    });\n\n    const monthNames={\n      "2026-08":"Серпень 2026","2026-09":"Вересень 2026","2026-10":"Жовтень 2026","2026-11":"Листопад 2026",\n      "2026-12":"Грудень 2026","2027-01":"Січень 2027","2027-02":"Лютий 2027",\n      "2027-03":"Березень 2027","2027-04":"Квітень 2027","2027-05":"Травень 2027"\n    };\n    const weekdays=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];\n\n    const availableMonths=Object.keys(monthGroups);\n    const activePeriod=$("#schPeriod").value;\n    const rememberedMonth=$("#scheduleMonthTabs").dataset.activeMonth;\n    const currentMonth=localIsoDate().slice(0,7);\n    let activeMonth=rememberedMonth && availableMonths.includes(rememberedMonth)\n      ? rememberedMonth\n      : (availableMonths.includes(currentMonth)?currentMonth:availableMonths[0]);\n\n    $("#scheduleMonthTabs").innerHTML=availableMonths.map(month=>`\n      <button type="button" class="schedule-month-tab ${month===activeMonth?"active":""}" data-month="${month}">\n        ${monthNames[month]||month}\n      </button>`).join("");\n\n    const renderScheduleMonth=month=>{\n      activeMonth=month;\n      $("#scheduleMonthTabs").dataset.activeMonth=month;\n      $$(".schedule-month-tab").forEach(b=>b.classList.toggle("active",b.dataset.month===month));\n\n      const dates=monthGroups[month]||[];\n      if(!dates.length){\n        $("#scheduleCalendar").innerHTML=\'<div class="empty">У цьому місяці немає дат.</div>\';\n        return;\n      }\n\n      const first=new Date(dates[0]+"T12:00:00");\n      const jsDay=first.getDay();\n      const mondayIndex=(jsDay+6)%7;\n      const blanks=Array.from({length:mondayIndex},()=>`<div class="schedule-day empty"></div>`).join("");\n\n      const cells=dates.map(date=>{\n        const dt=new Date(date+"T12:00:00");\n        const day=dt.getDay();\n        const st=stats[date];\n        const hiddenByFilter=(weekday && String(day)!==weekday) || st.free<minFree;\n        const projectEntries=Object.entries(st.reasons).sort((a,b)=>b[1]-a[1]).slice(0,3);\n\n        const isToday=localIsoDate()===date;\n        return `<div class="schedule-day ${day===0||day===6?"weekend":""} ${st.dayClass} ${isToday?"today-date":""}" data-date="${date}" style="${hiddenByFilter?"opacity:.28":""}">\n          <div class="schedule-day-number">${dt.getDate()}${isToday?\'<span class="today-mini">СЬОГОДНІ</span>\':""}</div>\n          <span class="schedule-score-badge ${st.cls}">${st.label}</span>\n          <div class="schedule-day-meta">\n            <div class="schedule-day-free">${st.free} вільні</div>\n            <div class="schedule-day-busy">${st.busy} зайняті</div>\n          </div>\n          <div class="schedule-day-projects">\n            ${projectEntries.map(([name,count])=>{\n              if(name==="🎓 Заняття"){\n                return `<span class="schedule-mini-project project-watermark" style="--project-color:${ACADEMIC_COLOR};"><span class="project-watermark-text">${esc(name)} ${count}</span></span>`;\n              }\n              const p=db.projects.find(x=>x.name===name);\n              return `<span class="schedule-mini-project project-watermark" style="${p?projectWatermarkStyle(p):"--project-color:#6b7280;"}">${p?projectWatermarkInner(p,`${esc(name)} ${count}`):`<span class="project-watermark-text">${esc(name)} ${count}</span>`}</span>`;\n            }).join("")}\n          </div>\n        </div>`;\n      }).join("");\n\n      $("#scheduleCalendar").innerHTML=`<section class="schedule-month schedule-month-single">\n        <div class="schedule-month-head">\n          <h2>${monthNames[month]||month}</h2>\n          <div class="schedule-month-nav">\n            <button type="button" class="ghost schedule-prev-month" ${availableMonths.indexOf(month)===0?"disabled":""}>← Попередній</button>\n            <span>Натисни на день, щоб побачити деталі</span>\n            <button type="button" class="ghost schedule-next-month" ${availableMonths.indexOf(month)===availableMonths.length-1?"disabled":""}>Наступний →</button>\n          </div>\n        </div>\n        <div class="schedule-cal">\n          ${weekdays.map(w=>`<div class="schedule-cal-head">${w}</div>`).join("")}\n          ${blanks}${cells}\n        </div>\n      </section>`;\n\n      $$(".schedule-day[data-date]").forEach(el=>el.onclick=()=>showDay(el.dataset.date));\n\n      const idx=availableMonths.indexOf(month);\n      const prev=$(".schedule-prev-month");\n      const next=$(".schedule-next-month");\n      if(prev) prev.onclick=()=>idx>0&&renderScheduleMonth(availableMonths[idx-1]);\n      if(next) next.onclick=()=>idx<availableMonths.length-1&&renderScheduleMonth(availableMonths[idx+1]);\n    };\n\n    $$(".schedule-month-tab").forEach(btn=>btn.onclick=()=>renderScheduleMonth(btn.dataset.month));\n    renderScheduleMonth(activeMonth);\n\n    $$(".schedule-open-day").forEach(el=>el.onclick=()=>{\n      if(el.dataset.date) showDay(el.dataset.date);\n    });\n  };\n\n  $("#schPeriod").onchange=()=>{\n    const tabs=$("#scheduleMonthTabs");\n    if(tabs) delete tabs.dataset.activeMonth;\n    render();\n  };\n  $("#schWeekday").onchange=render;\n  $("#schMinFree").onchange=render;\n  $("#schGroup").onchange=render;\n  render();\n}\n\n\n// ===== «Зустріч із індустрією» · REMS Control v4.0 =====\nconst INDUSTRY_COLLECTION="rems_industry_meetings";\nconst INDUSTRY_MEDIA_COLLECTION="rems_industry_media";\nconst industryBlockNames={\n  text:"Текст",\n  heading:"Підзаголовок",\n  quote:"Цитата",\n  gallery:"Фото",\n  story:"Відео",\n  youtube:"YouTube",\n  social:"Instagram / TikTok",\n  audio:"Аудіо",\n  file:"Файл / PDF",\n  link:"Посилання",\n  guest:"Про гостя",\n  divider:"Розділювач"\n};\nlet industryCache=[];\nconst industryId=()=>`meeting-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;\nconst industryBlockId=()=>`b-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;\n\nfunction normalizeIndustryBlock(raw={}){\n  const b={...raw};\n  b.id=b.id||industryBlockId();\n\n  // Old editor types are converted instead of disappearing when the material\n  // is opened in the new constructor.\n  if(b.type==="image"){\n    return {\n      id:b.id,\n      type:"gallery",\n      items:[b.url].filter(Boolean),\n      caption:b.caption||""\n    };\n  }\n  if(b.type==="twoImages"){\n    return {\n      id:b.id,\n      type:"gallery",\n      items:[b.url,b.url2].filter(Boolean),\n      caption:b.caption||""\n    };\n  }\n\n  // Keep all current fields explicitly so reopening the editor is lossless.\n  b.type=b.type||"text";\n  b.content=String(b.content||"");\n  b.url=String(b.url||"");\n  b.url2=String(b.url2||"");\n  b.caption=String(b.caption||"");\n  b.items=Array.isArray(b.items)?b.items.filter(Boolean):[];\n  return b;\n}\nfunction normalizeIndustryMeeting(raw={}){\n  return {\n    ...raw,\n    blocks:Array.isArray(raw.blocks)?raw.blocks.map(normalizeIndustryBlock):[]\n  };\n}\n\nasync function industryLoad(){\n  if(!cloudDb) return [];\n  const snap=await getDocs(collection(cloudDb,INDUSTRY_COLLECTION));\n  industryCache=[]; snap.forEach(d=>industryCache.push(normalizeIndustryMeeting({...d.data(),id:d.id})));\n  industryCache.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));\n  return industryCache;\n}\nasync function compressIndustryImage(file){\n  const bitmap=await createImageBitmap(file);\n  const maxSide=1600;\n  let w=bitmap.width, h=bitmap.height;\n  const scale=Math.min(1,maxSide/Math.max(w,h));\n  w=Math.max(1,Math.round(w*scale));\n  h=Math.max(1,Math.round(h*scale));\n  const canvas=document.createElement("canvas");\n  canvas.width=w; canvas.height=h;\n  const ctx=canvas.getContext("2d",{alpha:false});\n  ctx.fillStyle="#111";\n  ctx.fillRect(0,0,w,h);\n  ctx.drawImage(bitmap,0,0,w,h);\n  try{bitmap.close?.();}catch{}\n  let q=.82;\n  let data=canvas.toDataURL("image/webp",q);\n  // Keep safely below Firestore\'s 1 MiB document limit.\n  while(data.length>650000 && q>.42){\n    q-=.07;\n    data=canvas.toDataURL("image/webp",q);\n  }\n  if(data.length>850000){\n    throw new Error("Фото завелике навіть після стискання. Спробуй інше фото.");\n  }\n  return data;\n}\nasync function industryResolveMedia(value){\n  const s=String(value||"").trim();\n  const prefix="firestore-media://";\n  if(!s.startsWith(prefix)) return s;\n  const id=s.slice(prefix.length);\n  if(!id||!cloudDb) return "";\n  try{\n    const snap=await getDoc(doc(cloudDb,INDUSTRY_MEDIA_COLLECTION,id));\n    return snap.exists()?String(snap.data()?.data||""):"";\n  }catch(e){ console.error("Industry media preview failed",e); return ""; }\n}\n\nfunction industryStoredValueHtml(value,label="Збережено"){\n  const v=String(value||"").trim();\n  if(!v)return "";\n  const short=v.startsWith("firestore-media://")\n    ? "Фото збережене у Firebase"\n    : (v.length>72?v.slice(0,69)+"…":v);\n  return `<div class="industry-stored-value">\n    <span class="industry-stored-dot">✓</span>\n    <span><b>${label}</b><small>${esc(short)}</small></span>\n  </div>`;\n}\n\nasync function industrySetPreview(box,value){\n  if(!box)return;\n  const src=await industryResolveMedia(value);\n  box.innerHTML=src?`<img src="${src}" alt="">`:"";\n  box.classList.toggle("has-image",!!src);\n}\nlet industryUploadJobs=new Set();\nfunction industryTrackUpload(promise){\n  const job=Promise.resolve(promise);\n  industryUploadJobs.add(job);\n  job.finally(()=>industryUploadJobs.delete(job));\n  return job;\n}\nasync function industryWaitForUploads(){\n  const jobs=[...industryUploadJobs];\n  if(!jobs.length) return;\n  const timeout=new Promise((_,reject)=>\n    setTimeout(()=>reject(new Error("Завантаження медіа триває надто довго. Перевір файл або встав посилання.")),45000)\n  );\n  const results=await Promise.race([\n    Promise.allSettled(jobs),\n    timeout\n  ]);\n  const failed=Array.isArray(results)?results.find(r=>r.status==="rejected"):null;\n  if(failed) throw failed.reason;\n}\nasync function industryUpload(file,meetingId,kind="media"){\n  if(!file) return "";\n  // Images are stored in Firestore, just like student photos.\n  // This avoids dependence on Firebase Storage for article photos.\n  if(String(file.type||"").startsWith("image/")){\n    if(!cloudDb||!currentUser) throw new Error("Firebase ще не готовий");\n    const id=`media-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;\n    const data=await compressIndustryImage(file);\n    await setDoc(doc(cloudDb,INDUSTRY_MEDIA_COLLECTION,id),{\n      id,\n      meetingId:String(meetingId||""),\n      kind:String(kind||"image"),\n      name:String(file.name||"photo"),\n      mime:"image/webp",\n      data,\n      createdAt:new Date().toISOString()\n    },{merge:false});\n    return `firestore-media://${id}`;\n  }\n\n  // Video/audio/PDF files are not stored in Firestore: they are too large.\n  // Direct Storage uploads previously caused the editor to wait indefinitely.\n  // Use a URL block / YouTube / Instagram-TikTok for these media types.\n  if(String(file.type||"").startsWith("video/")){\n    throw new Error("Відеофайл напряму не завантажується. Встав посилання на відео або використай блок YouTube / Instagram / TikTok.");\n  }\n  if(String(file.type||"").startsWith("audio/")){\n    throw new Error("Аудіофайл напряму не завантажується. Встав пряме посилання на аудіо.");\n  }\n  throw new Error("Цей тип файла напряму не завантажується. Використай посилання на файл.");\n}\nfunction industryBlockPickerHtml(){\n  return `<div class="industry-picker">\n    ${Object.entries(industryBlockNames).map(([k,v])=>`<button type="button" class="industry-pick" data-type="${k}">${v}</button>`).join("")}\n  </div>`;\n}\nfunction industryBlockHtml(b={id:industryBlockId(),type:"text"}){\n  const name=industryBlockNames[b.type]||b.type;\n  const head=`<div class="industry-block-head">\n    <div><span class="industry-block-kind">Блок</span><b>${name}</b></div>\n    <div class="industry-block-actions">\n      <button type="button" class="mini ib-up" title="Вище">↑</button>\n      <button type="button" class="mini ib-down" title="Нижче">↓</button>\n      <button type="button" class="mini ib-remove" title="Видалити">×</button>\n    </div>\n  </div>`;\n  const media=(label,key="url",accept="image/*")=>`<label>${label}<input class="ib-${key}" value="${esc(b[key]||"")}" placeholder="URL або завантаж файл нижче"></label>${industryStoredValueHtml(b[key],b[key]?"Файл уже збережений":"")}<label class="industry-file">Замінити / завантажити файл<input class="ib-file" data-key="${key}" type="file" accept="${accept}"><span class="industry-media-preview" data-preview="${key}"></span></label>`;\n  let body="";\n  if(b.type==="text") body=`<label>Текст<textarea class="ib-content ib-richtext" placeholder="Пиши наступну частину статті…">${esc(b.content||"")}</textarea></label>`;\n  if(b.type==="heading") body=`<label>Підзаголовок<input class="ib-content" value="${esc(b.content||"")}" placeholder="Назва розділу"></label>`;\n  if(b.type==="quote") body=`<label>Цитата<textarea class="ib-content" placeholder="Важлива репліка гостя…">${esc(b.content||"")}</textarea></label><label>Автор / контекст<input class="ib-caption" value="${esc(b.caption||"")}"></label>`;\n  if(b.type==="gallery") body=`<div class="industry-photo-block">\n      <label>Фото · можна додавати скільки завгодно\n        <textarea class="ib-content industry-photo-urls" placeholder="Фото з’являтимуться тут автоматично">${esc((b.items||[]).join("\\n"))}</textarea>\n      </label>\n      <label class="industry-file industry-photo-upload">+ Додати фото\n        <input class="ib-gallery-files" type="file" accept="image/*" multiple>\n      </label>\n      <div class="industry-gallery-preview"></div>\n      <label>Підпис до фото / групи фото<input class="ib-caption" value="${esc(b.caption||"")}"></label>\n    </div>`;\n  if(b.type==="story") body=`<label>Посилання на відео<input class="ib-url" value="${esc(b.url||"")}" placeholder="Пряме посилання на .mp4/.webm"></label>${industryStoredValueHtml(b.url,"Відео збережено")}<div class="ib-progress">Для відео з YouTube, Instagram або TikTok краще використовуй відповідний окремий блок.</div><label>Підпис<input class="ib-caption" value="${esc(b.caption||"")}"></label>`;\n  if(b.type==="youtube") body=`<label>Посилання YouTube<input class="ib-url" value="${esc(b.url||"")}" placeholder="https://youtube.com/..."></label>${industryStoredValueHtml(b.url,"YouTube збережено")}<label>Підпис<input class="ib-caption" value="${esc(b.caption||"")}"></label>`;\n  if(b.type==="social") body=`<label>Instagram / TikTok<input class="ib-url" value="${esc(b.url||"")}" placeholder="Встав посилання на Reel, пост або TikTok"></label>${industryStoredValueHtml(b.url,"Посилання збережено")}<label>Підпис<input class="ib-caption" value="${esc(b.caption||"")}"></label>`;\n  if(b.type==="audio") body=`<label>Посилання на аудіо<input class="ib-url" value="${esc(b.url||"")}" placeholder="URL аудіофайлу"></label>${industryStoredValueHtml(b.url,"Аудіо збережено")}<label>Назва / підпис<input class="ib-caption" value="${esc(b.caption||"")}"></label>`;\n  if(b.type==="file") body=`<label>Посилання на файл / PDF<input class="ib-url" value="${esc(b.url||"")}" placeholder="URL документа"></label>${industryStoredValueHtml(b.url,"Файл збережено")}<label>Назва файла<input class="ib-content" value="${esc(b.content||"")}" placeholder="Наприклад: Презентація майстер-класу"></label><label>Короткий опис<input class="ib-caption" value="${esc(b.caption||"")}"></label>`;\n  if(b.type==="link") body=`<label>Посилання<input class="ib-url" value="${esc(b.url||"")}" placeholder="https://..."></label>${industryStoredValueHtml(b.url,"Посилання збережено")}<label>Заголовок картки<input class="ib-content" value="${esc(b.content||"")}"></label><label>Опис<input class="ib-caption" value="${esc(b.caption||"")}"></label>`;\n  if(b.type==="guest") body=`<div class="industry-guest-fields">${media("Фото гостя","url")}<label>Ім’я гостя<input class="ib-content" value="${esc(b.content||"")}"></label><label>Професія / коротка довідка<textarea class="ib-caption">${esc(b.caption||"")}</textarea></label><label>Instagram / сайт<input class="ib-url2" value="${esc(b.url2||"")}"></label></div>`;\n  if(b.type==="divider") body=`<div class="industry-divider-preview"><span></span></div>`;\n  return `<div class="industry-block" data-id="${b.id}" data-type="${b.type}">\n    ${head}\n    <div class="industry-block-body">${body}<div class="ib-progress"></div></div>\n    <button type="button" class="industry-insert-toggle">+ Додати блок після цього</button>\n    <div class="industry-inline-picker" hidden>${industryBlockPickerHtml()}</div>\n  </div>`;\n}\nasync function industryGalleryPreview(el){\n  const wrap=el.querySelector(".industry-gallery-preview");\n  if(!wrap)return;\n  const area=el.querySelector(".ib-content");\n  const vals=(area?.value||"").split(/\\n+/).map(x=>x.trim()).filter(Boolean);\n  wrap.innerHTML="";\n  for(const v of vals){\n    const box=document.createElement("div");\n    box.className="industry-gallery-thumb";\n    const img=document.createElement("img");\n    const src=await industryResolveMedia(v);\n    if(src) img.src=src;\n    const del=document.createElement("button");\n    del.type="button"; del.textContent="×"; del.title="Прибрати фото";\n    del.onclick=()=>{\n      const next=(area.value||"").split(/\\n+/).map(x=>x.trim()).filter(Boolean).filter(x=>x!==v);\n      area.value=next.join("\\n");\n      industryGalleryPreview(el);\n    };\n    box.append(img,del); wrap.append(box);\n  }\n}\nfunction industryWireBlocks(meetingId){\n  $$(".industry-block").forEach(el=>{\n    el.querySelector(".ib-remove").onclick=()=>el.remove();\n    el.querySelector(".ib-up").onclick=()=>el.previousElementSibling&&el.parentNode.insertBefore(el,el.previousElementSibling);\n    el.querySelector(".ib-down").onclick=()=>el.nextElementSibling&&el.parentNode.insertBefore(el.nextElementSibling,el);\n    const toggle=el.querySelector(".industry-insert-toggle");\n    const inline=el.querySelector(".industry-inline-picker");\n    toggle.onclick=()=>{inline.hidden=!inline.hidden;};\n    inline.querySelectorAll(".industry-pick").forEach(btn=>btn.onclick=()=>{\n      el.insertAdjacentHTML("afterend",industryBlockHtml({id:industryBlockId(),type:btn.dataset.type}));\n      industryWireBlocks(meetingId);\n    });\n    el.querySelectorAll(".ib-file").forEach(inp=>inp.onchange=async()=>{\n      const file=inp.files?.[0]; if(!file)return;\n      const out=el.querySelector(`.ib-${inp.dataset.key}`);\n      const prog=el.querySelector(".ib-progress");\n\n      if(String(file.type||"").startsWith("video/")){\n        inp.value="";\n        prog.textContent="Відео: встав URL у поле вище або використай блок YouTube / Instagram / TikTok.";\n        out.focus();\n        return;\n      }\n      if(String(file.type||"").startsWith("audio/")){\n        inp.value="";\n        prog.textContent="Аудіо: встав пряме посилання у поле вище.";\n        out.focus();\n        return;\n      }\n\n      const task=(async()=>{\n        prog.textContent="Завантаження…";\n        out.value=await industryUpload(file,meetingId,el.dataset.type);\n        await industrySetPreview(el.querySelector(`[data-preview="${inp.dataset.key}"]`),out.value);\n        prog.textContent="Файл збережено ✓";\n      })();\n      try{await industryTrackUpload(task);}catch(e){console.error(e);prog.textContent=`Помилка: ${e?.message||e}`;}\n    });\n    const gf=el.querySelector(".ib-gallery-files");\n    if(gf) gf.onchange=async()=>{\n      const area=el.querySelector(".ib-content"),prog=el.querySelector(".ib-progress");\n      const files=[...gf.files];\n      if(!files.length)return;\n      const task=(async()=>{\n        prog.textContent=`Завантаження фото: 0/${files.length}`;\n        const urls=[];\n        for(let i=0;i<files.length;i++){\n          urls.push(await industryUpload(files[i],meetingId,"gallery"));\n          prog.textContent=`Завантаження фото: ${i+1}/${files.length}`;\n        }\n        area.value=[area.value.trim(),...urls].filter(Boolean).join("\\n");\n        await industryGalleryPreview(el);\n        prog.textContent=`Додано фото: ${urls.length} ✓`;\n        gf.value="";\n      })();\n      try{await industryTrackUpload(task);}catch(e){console.error(e);prog.textContent=`Помилка: ${e?.message||e}`;}\n    };\n    el.querySelectorAll("[data-preview]").forEach(box=>{\n      const input=el.querySelector(`.ib-${box.dataset.preview}`);\n      if(input?.value)industrySetPreview(box,input.value);\n    });\n    if(el.dataset.type==="gallery")industryGalleryPreview(el);\n  });\n}\nfunction industryReadBlocks(){\n  return $$(".industry-block").map(el=>({\n    id:el.dataset.id,\n    type:el.dataset.type,\n    content:el.querySelector(".ib-content")?.value.trim()||"",\n    url:el.querySelector(".ib-url")?.value.trim()||"",\n    url2:el.querySelector(".ib-url2")?.value.trim()||"",\n    caption:el.querySelector(".ib-caption")?.value.trim()||"",\n    items:el.dataset.type==="gallery"?(el.querySelector(".ib-content")?.value||"").split(/\\n+/).map(x=>x.trim()).filter(Boolean):[]\n  }));\n}\nasync function industryEditor(m=null){\n  // New editor session: never inherit unfinished upload state from a previous article.\n  industryUploadJobs=new Set();\n  const item=m?clone(m):{id:industryId(),published:false,blocks:[]};\n  $("#pageTitle").textContent=m?"Редагування зустрічі":"Нова зустріч";\n  $("#app").innerHTML=`<div class="industry-editor"><button class="ghost" id="industryBack">← До всіх зустрічей</button><div class="section-head"><div><h2>${m?"Редагувати":"Створити"} матеріал</h2><p>Серія майстер-класів «Зустріч із індустрією»</p></div></div><div class="industry-form-grid"><label>Гість<input id="imGuest" value="${esc(item.guest||"")}"></label><label>Професія / посада<input id="imRole" value="${esc(item.guestRole||"")}"></label><label>Тема зустрічі<input id="imTitle" value="${esc(item.title||"")}"></label><label>Дата<input id="imDate" type="date" value="${esc(item.date||"")}"></label><label class="full">Короткий анонс<textarea id="imExcerpt">${esc(item.excerpt||"")}</textarea></label><label class="full">Обкладинка<input id="imCover" value="${esc(item.cover||"")}" placeholder="Завантаж фото нижче або встав URL"></label>${item.cover?`<div class="full">${industryStoredValueHtml(item.cover,"Обкладинка вже збережена")}</div>`:""}<label class="industry-file full">Замінити / завантажити обкладинку<input id="imCoverFile" type="file" accept="image/*"><span class="ib-progress" id="imCoverProgress"></span><span class="industry-media-preview" id="imCoverPreview"></span></label><label class="industry-publish full"><input id="imPublished" type="checkbox" ${item.published?"checked":""}><span><b>Опублікувати на сайті</b><small>Вимкнено - матеріал залишається чернеткою</small></span></label></div><div class="industry-builder"><div class="industry-builder-title"><div><h3>Стаття</h3><p class="muted">Будуй матеріал у потрібному порядку: текст → фото → текст → відео → цитата…</p></div></div><div class="industry-first-add"><b>Додати перший / наступний блок</b>${industryBlockPickerHtml()}</div><div id="industryBlocks">${(item.blocks||[]).map(industryBlockHtml).join("")}</div></div><div class="industry-savebar"><button class="danger" id="industryDelete" ${m?"":"style=display:none"}>Видалити</button><button class="primary" id="industrySave">Зберегти</button></div></div>`;\n  industryWireBlocks(item.id);\n  if(item.cover) industrySetPreview($("#imCoverPreview"),item.cover);\n  $("#industryBack").onclick=industry;\n  $("#imCoverFile").onchange=async()=>{\n    const f=$("#imCoverFile").files?.[0]; if(!f)return;\n    const prog=$("#imCoverProgress");\n    $("#imCoverFile").disabled=true;\n    const task=(async()=>{\n      prog.textContent="Стискаємо й зберігаємо фото…";\n      $("#imCover").value=await industryUpload(f,item.id,"cover");\n      await industrySetPreview($("#imCoverPreview"),$("#imCover").value);\n      prog.textContent="Фото збережено ✓";\n    })();\n    try{await industryTrackUpload(task);}\n    catch(e){console.error(e);prog.textContent=`Помилка: ${e?.message||e}`;}\n    finally{$("#imCoverFile").disabled=false;}\n  };\n  $$(".industry-first-add .industry-pick").forEach(b=>b.onclick=()=>{$("#industryBlocks").insertAdjacentHTML("beforeend",industryBlockHtml({id:industryBlockId(),type:b.dataset.type}));industryWireBlocks(item.id);});\n  $("#industrySave").onclick=async()=>{\n    const btn=$("#industrySave");\n    if(industryUploadJobs.size){\n      btn.disabled=true;\n      btn.textContent="Завершуємо медіа…";\n      try{await industryWaitForUploads();}\n      catch(e){btn.disabled=false;btn.textContent="Зберегти";alert(`Не вдалося завершити завантаження медіа. ${e?.message||e}`);return;}\n    }\n    const guest=$("#imGuest").value.trim();\n    const title=$("#imTitle").value.trim();\n    if(!guest && !title){\n      alert("Вкажи хоча б ім’я гостя або тему зустрічі.");\n      return;\n    }\n    btn.disabled=true;\n    btn.textContent="Збереження…";\n    const data={\n      id:item.id,\n      guest,\n      guestRole:$("#imRole").value.trim(),\n      title,\n      date:$("#imDate").value,\n      excerpt:$("#imExcerpt").value.trim(),\n      cover:$("#imCover").value.trim(),\n      published:$("#imPublished").checked,\n      blocks:industryReadBlocks().map(normalizeIndustryBlock),\n      updatedAt:new Date().toISOString()\n    };\n    try{\n      await setDoc(doc(cloudDb,INDUSTRY_COLLECTION,data.id),data,{merge:false});\n      alert(data.published?"Матеріал опубліковано.":"Чернетку збережено.");\n      industry();\n    }catch(e){\n      console.error(e);\n      alert(`Не вдалося зберегти зустріч у Firebase. ${e?.code||e?.message||""}`);\n    }finally{\n      btn.disabled=false;\n      btn.textContent="Зберегти";\n    }\n  };\n  if(m) $("#industryDelete").onclick=async()=>{if(!confirm("Видалити цю зустріч?"))return;await deleteDoc(doc(cloudDb,INDUSTRY_COLLECTION,item.id));industry();};\n}\nasync function industry(){\n  $("#pageTitle").textContent="Зустріч із індустрією"; $("#pageSubtitle").textContent="Серія майстер-класів РЕМС-44";\n  $("#app").innerHTML=`<div class="loading">Завантаження…</div>`;\n  try{await industryLoad();}catch(e){console.error(e);$("#app").innerHTML=`<div class="empty">Не вдалося завантажити матеріали. Перевір Firebase Rules.</div>`;return;}\n  $("#app").innerHTML=`<div class="section-head"><div><h2>Матеріали зустрічей</h2><p>Створюй і редагуй статті серії майстер-класів та гостьових лекцій.</p></div></div><div class="industry-grid">${industryCache.length?industryCache.map(m=>`<article class="industry-card">${m.cover?`<div class="industry-card-cover" data-cover="${esc(m.cover)}"><span>Завантаження…</span></div>`:`<div class="industry-card-empty">Без обкладинки</div>`}<div class="industry-card-meta">${esc(m.date||"Без дати")} · ${m.published?"Опубліковано":"Чернетка"}</div><h3>${esc(m.guest||m.title||"Без назви")}</h3><p>${esc(m.guestRole||m.title||"")}</p><button class="ghost industry-edit" data-id="${m.id}">Редагувати матеріал</button></article>`).join(""):`<div class="empty">Ще немає жодної зустрічі. Натисни «+ Нова зустріч» угорі праворуч.</div>`}</div>`;\n  $$(".industry-card-cover").forEach(async box=>{\n    const src=await industryResolveMedia(box.dataset.cover||"");\n    box.innerHTML=src?`<img src="${src}" alt="">`:`<span>Фото збережене</span>`;\n  });\n  $$(".industry-edit").forEach(b=>b.onclick=()=>industryEditor(industryCache.find(x=>x.id===b.dataset.id)));\n}\n\n\n(function installV51UiStyles(){\n  if(document.querySelector("#v51UiStyles")) return;\n  const style=document.createElement("style");\n  style.id="v51UiStyles";\n  style.textContent=`\n    .conflict-notice-button{width:100%;text-align:left;border:0;cursor:pointer;font:inherit;display:flex;justify-content:space-between;align-items:center;gap:12px}\n    .con  persistLargeForms();\n}\nconst lfStatusLabels={active:"Активний",completed:"Завершений",archive:"Архів"};\nfunction lfNormalizeStatus(v){ return v==="completed"||v==="archive"?v:"active"; }\nfunction lfAuthorIds(x){\n  const ids=Array.isArray(x?.authorIds)?x.authorIds.map(String).filter(Boolean):[];\n  if(!ids.length&&x?.authorId) ids.push(String(x.authorId));\n  return [...new Set(ids)];\n}\nfunction lfAuthorNames(x){\n  const names=lfAuthorIds(x).map(id=>(db.students||[]).find(s=>String(s.id)===String(id))?.name).filter(Boolean);\n  if(names.length) return names;\n  return String(x?.authorLabel||"").split(",").map(v=>v.trim()).filter(Boolean);\n}\n\nasync function loadLargeForms(){\n  db.largeForms=Array.isArray(db.largeForms)?db.largeForms:[];\n  // v42.4: спрощуємо картку великої форми. Старі службові поля більше не використовуються.\n  let changed=false;\n  const starterById=new Map(LARGE_FORMS_STARTER_SEED.map(seed=>[String(seed.id),seed]));\n  db.largeForms=db.largeForms.map(item=>{\n    const x={...item};\n    const normalized=lfNormalizeStatus(x.status);\n    if(x.status!==normalized){ x.status=normalized; changed=true; }\n    if(!Array.isArray(x.authorIds)){\n      x.authorIds=x.authorId?[String(x.authorId)]:[];\n      changed=true;\n    }\n    for(const k of ["idea","concept","notes"]){ if(k in x){ delete x[k]; changed=true; } }\n    // v42.5: підключаємо створені Google Drive папки до 4 стартових великих форм.\n    const starter=starterById.get(String(x.id));\n    if(starter?.driveUrl && !String(x.driveUrl||"").trim()){ x.driveUrl=starter.driveUrl; changed=true; }\n    return x;\n  });\n  largeFormsCache=clone(db.largeForms).sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));\n  if(changed && cloudReady&&cloudDb&&currentUser) await persistLargeForms();\n  return largeFormsCache;\n}\n\nasync function saveLargeForm(data){\n  if(!cloudReady||!cloudDb||!currentUser) throw new Error("Хмара ще не готова");\n  db.largeForms=Array.isArray(db.largeForms)?db.largeForms:[];\n  const id=String(data.id||(`lf-${Date.now()}-${Math.random().toString(36).slice(2,7)}`));\n  const clean={...data,id,updatedAt:new Date().toISOString(),updatedBy:currentUser.email||currentUser.uid||""};\n  if(!clean.createdAt) clean.createdAt=clean.updatedAt;\n  const i=db.largeForms.findIndex(x=>String(x.id)===id);\n  if(i>=0) db.largeForms[i]=clean; else db.largeForms.push(clean);\n  await persistLargeForms();\n  await loadLargeForms();\n  return clean;\n}\nasync function deleteLargeForm(id){\n  if(!cloudReady||!cloudDb||!currentUser) return false;\n  db.largeForms=Array.isArray(db.largeForms)?db.largeForms:[];\n  db.largeForms=db.largeForms.filter(x=>String(x.id)!==String(id));\n  await persistLargeForms();\n  await loadLargeForms();\n  return true;\n}\n\n// v44.0 - «Режисерська лабораторія»: живий конструктор навчальної траєкторії.\n// Структура лабораторії зберігається окремо від відповідей студентів, тому її можна\n// розширювати впродовж семестру без втрати вже заповнених матеріалів.\nconst DIRECTING_LABS_KEY="directingLabs";\nconst DIRECTING_LAB_WORK_COLLECTION="rems_directing_lab_work";\nconst DIRECTING_LAB_FEEDBACK_COLLECTION="rems_directing_lab_feedback";\nconst DIRECTING_LAB_SCHEMA_COLLECTION="rems_directing_lab_schema";\nconst DIRECTING_LAB_SCHEMA_DOC="current";\nlet directingLabFilter="44";\nlet directingLabSchemaCache=null;\n\nconst DIRECTING_LAB_JUSTIFICATION_SECTION={"id":"choice-justification","title":"1.1. Обґрунтування вибору","intro":"**Обґрунтування вибору** допомагає режисерові зрозуміти, чому саме цей проєкт має бути створений, чому він важливий зараз і чи реально втілити його у конкретних умовах. Це не формальна відповідь на питання «чому мені цікава тема», а послідовне осмислення історичного, соціального, мистецького, авторського та практичного контексту майбутньої постановки.","published":true,"blocks":[{"id":"choiceHistorical","type":"textarea","title":"1.1.1. Історичний аспект","help":"Визначте історичний, культурний або біографічний контекст теми. Відбирайте лише те, що реально допомагає майбутній постановці.","placeholder":"Коротко опишіть історичний контекст і те, що з нього важливо для проєкту...","theory":"**Історичний аспект** допомагає зрозуміти, звідки походить тема або явище, як воно формувалося і який контекст важливо врахувати режисерові. Це може бути історія події, традиції, культурного явища, біографія конкретної постаті, особливості епохи або зміна суспільного ставлення до теми з часом.\\n\\n**Не перетворюйте цей пункт на великий історичний реферат.** Ваше завдання - відібрати тільки той фактаж, який допомагає осмислити майбутній проєкт і може стати матеріалом для режисерського рішення.\\n\\n**Головне питання:** що з історичного контексту допомагає мені точніше зрозуміти цю тему сьогодні?"},{"id":"choiceSocial","type":"textarea","title":"1.1.2. Соціальний аспект","help":"Поясніть, чому ця тема важлива сучасній людині та для кого вона є актуальною.","placeholder":"У чому сучасна актуальність теми, кого вона стосується, які питання порушує...","theory":"**Соціальний аспект** показує, як тема пов\'язана із сучасною людиною, суспільством, культурою та конкретною аудиторією. Навіть розважальний концерт, шоу чи церемонія існують у певному соціальному середовищі й відображають його цінності, настрої, суперечності та очікування.\\n\\nВизначте, яка сучасна проблема, потреба або явище стоїть за вашою темою, кого це стосується, чому про це варто говорити саме зараз, які думки або почуття тема може викликати в глядача.\\n\\n**Недостатньо написати «тема актуальна».** Поясніть, у чому саме полягає її актуальність і для кого вона є актуальною."},{"id":"choiceArtistic","type":"textarea","title":"1.1.3. Мистецький аспект","help":"Поясніть, чому цю тему варто втілювати саме як сценічний мистецько-видовищний проєкт.","placeholder":"Що саме сценічна форма дає цій темі: музика, простір, світло, пластика, відео, жива присутність...","theory":"**Мистецький аспект** відповідає на питання, чому тема потребує саме сценічного втілення. Подумайте, що вона набуває завдяки живій присутності виконавця, музиці, світлу, простору, пластичному рішенню, сценографії, відео, монтажу та взаємодії з аудиторією.\\n\\nВажливо також усвідомити, чому для задуму доречна саме обрана велика форма: концерт, шоу, вистава, вечір, церемонія, конкурс, фестиваль, свято або презентація.\\n\\n**Тема повинна мати не лише змістове значення, а й потенціал для образного та сценічного розвитку.**"},{"id":"choiceAuthor","type":"textarea","title":"1.1.4. Авторський аспект","help":"Сформулюйте, чому саме ви як режисер хочете говорити про цю тему.","placeholder":"Що вас особисто зачепило, хвилює, надихає або змушує поставити це питання...","theory":"**Авторський аспект** виявляє вашу особисту режисерську мотивацію. Чому саме ви хочете говорити про цю тему? Що в ній вас зачепило, здивувало, обурило, надихнуло або змусило замислитися?\\n\\nДжерелом може бути особистий досвід, життєве спостереження, професійний інтерес, певна подія, емоційний зв\'язок із темою, бажання висловити позицію або спробувати нову сценічну форму.\\n\\n**Авторський аспект не зобов\'язує до надмірної особистої відвертості.** Йдеться насамперед про власну художню позицію та місце цієї теми у вашому режисерському мисленні."},{"id":"choiceFactorsReality","type":"textarea","title":"1.1.5. Чинники вибору та реальності проєкту","help":"Поєднайте об\'єктивні та суб\'єктивні чинники з реальною можливістю здійснити проєкт у ваших умовах.","placeholder":"Що об\'єктивно і суб\'єктивно впливає на вибір проєкту? Які ресурси є? Чого бракує? Що потрібно адаптувати або переосмислити?","wide":true,"theory":"На вибір і можливість реалізації проєкту одночасно впливають **об\'єктивні, суб\'єктивні та практичні чинники**. Їх доцільно розглядати разом, оскільки режисер працює не в абстрактних умовах, а співвідносить власний задум із конкретною реальністю.\\n\\n**Об\'єктивні чинники** - це обставини, що існують незалежно від ваших особистих симпатій: сучасність і актуальність проблеми, конкретна подія або замовлення, аудиторія, майданчик, бюджет, склад команди, технічна база, терміни, логістика та безпекові умови.\\n\\n**Суб\'єктивні чинники** пов\'язані з вами як режисером: світогляд, особиста мотивація, професійний досвід, творчі здібності, образне мислення, естетичні впливи та попередній мистецький досвід.\\n\\nДалі потрібно провести **перевірку задуму на реальність**. Оцініть, що у вашому розпорядженні вже є, що реально можна отримати, а що поки існує лише у бажаній моделі проєкту. Якщо задум вимагає ресурсів, яких немає, визначте, що можна змінити, скоротити, замінити або переосмислити без втрати головного сенсу.\\n\\n**Розрізняйте художньо бажане і реально можливе.** Обмеження не завжди послаблюють проєкт. Часто вони змушують знайти точніше, образніше й винахідливіше рішення.\\n\\n**Головне питання:** чи можу я реально поставити цей проєкт у тих умовах, у яких працюю?"},{"id":"choiceSummary","type":"textarea","title":"1.1.6. Підсумкове обґрунтування вибору проєкту","help":"На основі попередніх відповідей сформулюйте один цілісний авторський текст. Це підсумок усього підрозділу 1.1.","placeholder":"Сформулюйте повне обґрунтування вибору проєкту одним зв\'язним текстом...","wide":true,"summary":true,"theory":"**Підсумкове обґрунтування** - це не ще одна коротка відповідь, а завершений зв\'язний текст, який об\'єднує всі попередні аспекти в цілісну картину.\\n\\nУ тексті мають природно поєднатися історичний і соціальний контекст, мистецький потенціал теми, ваша авторська мотивація, чинники вибору та реальна можливість здійснення проєкту.\\n\\n**Не копіюйте механічно попередні відповіді.** Перебудуйте їх у логічний авторський текст, у якому одна думка переходить в іншу.\\n\\nПісля завершення цього пункту читач повинен зрозуміти: **чому саме цей проєкт, чому саме зараз, чому він важливий для глядача, чому саме ви хочете його створити і чи реально його втілити.**"}]};\nconst DIRECTING_LAB_PROJECT_PARAMETERS_SECTION={"id":"project-parameters","title":"1.2. Вихідні параметри проєкту","intro":"Цей розділ фіксує вихідні характеристики майбутнього проєкту. Тут важливо коротко і точно визначити, що саме ви створюєте, для кого, де, коли, у якому масштабі та просторі. Теоретичне пояснення до кожного пункту відкривається окремо.","published":true,"blocks":[{"id":"projectTitle","type":"text","title":"1.2.1. Назва проєкту","help":"Назва може бути робочою. Вона має відображати ідею, смисловий напрям або центральний образ проєкту.","placeholder":"Введіть назву проєкту","required":true,"theory":"Назва проєкту - це концентроване словесне вираження його ідеї та змісту. Вона не просто позначає подію, а має спрямовувати сприйняття глядача до головного смислу, авторського задуму або центрального образу.\\n\\nНа початковому етапі назва може бути робочою. У процесі роботи над проблемою, темою, ідеєю, художнім образом і режисерським задумом вона може уточнюватися або повністю змінюватися.\\n\\nНазва може бути прямою, образною, метафоричною, символічною або асоціативною. Головне, щоб вона відповідала ідеї проєкту, не була випадковою і могла органічно існувати в афіші, програмі та комунікації з глядачем.\\n\\nПеревірте себе питанням: чи передає ця назва головний смисловий напрям мого проєкту?"},{"id":"projectForm","type":"text","title":"1.2.2. Форма проєкту","help":"Вкажіть форму без прикметників: концерт, шоу, вистава, вечір, церемонія, конкурс, фестиваль, свято або презентація.","placeholder":"Наприклад: концерт","theory":"Форма проєкту - це тип сценічної або мистецько-видовищної організації майбутньої події. Вона відповідає на базове питання: що саме я створюю?\\n\\nУ назві форми не використовуйте прикметники, які характеризують художню природу проєкту. Такі уточнення з’являться у жанрі. Наприклад, форма: концерт. Жанрове уточнення: тематичний, ювілейний, гумористичний тощо.\\n\\nКОНЦЕРТ\\nПублічний виступ артистів за визначеною, заздалегідь складеною програмою. Основна особливість концерту - побудова з окремих номерів, кожен із яких має відносну самостійність. Номери поєднуються режисером у цілісну програму.\\n\\nШОУ\\nВидовищна сценічна форма, в основі якої лежать яскраві номери, атракціони та виразне використання технічних можливостей. Для шоу характерні видовищність, динаміка, візуальна виразність і сильний емоційний вплив. Чіткий сюжетний хід не є обов’язковим.\\n\\nШОУ-ВИСТАВА / ВИСТАВА\\nСценічна форма, побудована за законами єдиної дії, історії або сюжету. У шоу-виставі поєднуються принципи театральної вистави та видовищного шоу. Номери, технічні компоненти, сценографія та інші засоби підпорядковуються єдиній дії. Основна відмінність від концерту - обов’язкова сюжетна або чітко розгорнута драматургічна побудова.\\n\\nВЕЧІР\\nОсоблива сценічна форма, у якій поєднуються художні та документальні матеріали. Для вечора характерні реальні герої, документи, спогади, архівні матеріали та жива комунікація з аудиторією. Зазвичай вечір має конкретну присвяту людині, події, даті або мистецькому явищу.\\n\\nЦЕРЕМОНІЯ\\nУрочисте видовищне дійство з ритуально-обрядовою природою. Воно створюється з особливої нагоди: відкриття, закриття, нагородження, вшанування, посвяти тощо. Основна особливість - чіткий порядок символічних і ритуальних дій, які режисер перетворює на художньо осмислену сценічну подію.\\n\\nКОНКУРС\\nПублічне змагання, у якому через виступи, демонстрацію майстерності або творчих досягнень визначають найкращих серед учасників. Обов’язковими є змагальність, правила, критерії оцінювання та результат. Саме невідомість результату створює природну драматургію напруження.\\n\\nФЕСТИВАЛЬ\\nМасове мистецьке або культурне дійство, що об’єднує численних учасників, жанри, події, сцени та аудиторії. Основні риси фестивалю - масштабність і поліжанровість. Окремі події поєднуються спільною темою, ідеєю, образом і загальною режисерською логікою.\\n\\nСВЯТО\\nМасове культурне дійство, приурочене до певної події, дати або теми, яке об’єднує людей спільним переживанням. У межах свята можуть поєднуватися концерти, сценічні виступи, ігрові зони, виставкові та інтерактивні складові. Режисер має об’єднати різні компоненти в одну масштабну подію.\\n\\nПРЕЗЕНТАЦІЯ\\nТеатралізоване публічне дійство, спрямоване на представлення нового продукту, ідеї, твору або проєкту. Основна особливість - наявність конкретного об’єкта презентації, навколо якого будується вся драматургія. Режисер організовує не лише показ, а й момент відкриття, інтригу, емоційне сприйняття та запам’ятовування представленого об’єкта.\\n\\n**Наведений перелік не є вичерпним.** Можливо, ваш задум точніше відповідає іншій сценічній або мистецько-видовищній формі. Ви можете запропонувати власний варіант, якщо здатні пояснити, чому саме ця форма відповідає природі проєкту, його змісту та способу взаємодії з глядачем.\\n\\nПід час вибору форми не намагайтеся зробити назву складнішою. Спочатку точно визначте, до якого типу великої сценічної події належить ваш задум. Художні уточнення ви сформулюєте в пункті «Жанр»."},{"id":"projectGenre","type":"text","title":"1.2.3. Жанр","help":"Уточніть художню природу обраної форми. Саме тут з’являються характеристики, які не слід додавати до назви форми.","placeholder":"Вкажіть жанрову характеристику","theory":"Жанр - це авторське бачення та мистецька конкретизація форми проєкту. Якщо форма відповідає на питання «що саме я створюю?», то жанр уточнює, яким є цей проєкт художньо, в якому емоційному, стильовому та образному ключі він існує.\\n\\nСаме в жанрі з’являються прикметникові характеристики. Наприклад, форма може бути «концерт», а жанрове визначення уточнює його художню природу: тематичний, ювілейний, гумористичний та інший відповідно до конкретного задуму.\\n\\nЖанр впливає на характер сценічної дії, спосіб існування виконавців, режисерські прийоми, музику, світло, сценографію, пластичне рішення, монтаж і темпоритм. Усі складові постановки мають існувати в єдиному жанровому ключі.\\n\\nНе обирайте жанр тільки як красиве слово. Він повинен реально проявлятися у способі, яким ви будете будувати проєкт."},{"id":"projectScale","type":"text","title":"1.2.4. Масштаб проєкту","help":"Визначте масштаб події та рівень її охоплення. За потреби вкажіть орієнтовну кількість учасників і глядачів.","placeholder":"Наприклад: великий, міський","theory":"Масштаб визначає розмір, складність і рівень охоплення майбутнього проєкту. Його доцільно розглядати у двох площинах.\\n\\nЗа масштабом самої події: камерний, середній, великий, масовий.\\n\\nЗа рівнем охоплення: локальний, міський, регіональний, національний, міжнародний.\\n\\nМасштаб залежить не лише від кількості глядачів. На нього впливають кількість виконавців, склад творчо-постановочної групи, кількість майданчиків, технічна складність, тривалість і загальний обсяг постановочного процесу.\\n\\nЗа потреби зазначте орієнтовну кількість виконавців, інших учасників і глядачів. Коротко поясніть, чому саме так визначаєте масштаб проєкту."},{"id":"projectVenue","type":"text","title":"1.2.5. Простір / майданчик проведення","help":"Вкажіть реальний або передбачуваний майданчик, у якому має відбуватися проєкт.","placeholder":"Назва або тип майданчика, місто, локація","theory":"Простір / майданчик проведення - це конкретне фізичне середовище, у якому має відбуватися проєкт. Це може бути театральна сцена, концертний зал, клубний простір, площа, вулиця, стадіон, парк, музей, павільйон, виробничий або інший нетрадиційний простір.\\n\\nНа цьому етапі потрібно визначити саме реальний або передбачуваний майданчик. Художнє осмислення простору буде розглядатися пізніше в режисерському задумі.\\n\\nМайданчик впливає на розміри сценічної дії, розташування глядача, рух виконавців, можливості світла, звуку, відео, декорацій, монтажу, логістики та безпеки. Тому простір потрібно обирати не тільки за зовнішньою привабливістю, а й з огляду на те, чи дозволяє він реально втілити задум.\\n\\nЯкщо задум створюється спеціально для конкретної локації і суттєво залежить від її архітектури, історії або функції, обов’язково зазначте це."},{"id":"projectAudience","type":"textarea","title":"1.2.6. Цільова аудиторія","help":"Коротко визначте, для кого створюється проєкт. Врахуйте не тільки вік, а й інтереси, культурний досвід та мотивацію присутності.","placeholder":"Хто ваш глядач і чому цей проєкт адресований саме йому?","theory":"Цільова аудиторія - це конкретна група людей, для яких створюється проєкт. Визначення аудиторії не повинно обмежуватися лише віком.\\n\\nПодумайте про соціально-демографічні характеристики, культурний і глядацький досвід, інтереси, мотивацію присутності, очікування від події та можливий спосіб участі. Для одного проєкту глядач залишається спостерігачем, для іншого може активно взаємодіяти з виконавцями або простором.\\n\\nРежисеру важливо розуміти, хто ці люди, чому вони прийдуть, що вони вже знають про тему, які асоціації та очікування можуть мати і якою може бути їхня емоційна реакція.\\n\\nЗнання аудиторії надалі впливатиме на мову проєкту, тривалість, темп, способи комунікації, режисерські прийоми і характер взаємодії з глядачем."},{"id":"projectDateTime","type":"text","title":"1.2.7. Дата і час проведення","help":"Якщо точні дата і час ще не визначені, вкажіть орієнтовний період проведення.","placeholder":"Наприклад: 07.11.2026, 19:00 або орієнтовно грудень 2026","theory":"Дата і час проведення - це не лише організаційні дані. Для багатьох великих форм вони впливають і на режисерське рішення.\\n\\nДата може бути пов’язана зі святом, історичною подією, ювілеєм, фестивальним календарем, сезоном або іншим контекстом. Час проведення впливає на використання природного і сценічного світла, відео, атмосферу, погодні умови, транспортну доступність та тривалість перебування глядача.\\n\\nОсобливо важливими дата і час є для подій у відкритому просторі. Денне і вечірнє дійство на одному майданчику можуть потребувати принципово різних режисерських і технічних рішень.\\n\\nЯкщо точні дата та час ще не визначені, зазначте орієнтовний період. Його можна буде уточнити пізніше."},{"id":"projectDuration","type":"text","title":"1.2.8. Орієнтовна тривалість / хронометраж","help":"Вкажіть передбачувану тривалість усього проєкту. Для складних подій можна додати орієнтовну тривалість основних блоків.","placeholder":"Наприклад: 90 хвилин","theory":"Хронометраж - це передбачувана тривалість усього проєкту. Його варто визначити вже на початку, навіть якщо надалі він буде уточнюватися.\\n\\nТривалість безпосередньо впливає на композицію, архітектоніку, кількість епізодів і номерів, темпоритм, розподіл кульмінацій, переходи між частинами та здатність аудиторії утримувати увагу.\\n\\nПроєкт тривалістю 45 хвилин і проєкт тривалістю три години не можуть мати однакову драматургічну організацію. Для фестивалю, свята або багатомайданчикового проєкту важливо визначити не лише загальну тривалість, а й приблизний хронометраж окремих блоків або програм.\\n\\nНа цьому етапі достатньо реалістичної орієнтовної цифри. Пізніше вона буде уточнюватися разом зі сценарієм і постановочним планом."}]};\nconst DIRECTING_LAB_RESEARCH_SECTION={"id":"research-materials","title":"1.3. Пошук, дослідження та збір матеріалу","intro":"Після визначення вихідних параметрів проєкту починається дослідницький етап. Ваше завдання не просто накопичити посилання і файли, а зібрати матеріал, який допоможе глибше зрозуміти тему і поступово сформувати режисерський задум. Знайдені факти, документи, тексти, музика, зображення, відео, сценічні приклади та асоціації можуть згодом перетворитися на драматургію, образи, сценарний хід, монтажні зв’язки та інші засоби сценічного вираження. Матеріал доцільно збирати у двох напрямах: документальному та художньому. Паралельно ведіть режисерський блокнот, де фіксуйте власні ідеї, асоціації та можливі способи поєднання знайденого матеріалу. Це робочий накопичувальний етап: він не подається на перевірку. Коли первинна база сформована, студент лише фіксує результат етапу і продовжує поповнювати матеріали надалі.","published":true,"blocks":[{"id":"documentaryMaterials","type":"material_collection","collectionKind":"documentary","title":"1.3.1. Документальний матеріал","help":"Додавайте факти, документи, архівні матеріали, фото, відео, інтерв’ю, спогади, публікації та інші джерела, пов’язані з реальною дійсністю.","theory":"Документальний матеріал пов’язаний із реальною дійсністю і дає режисерові фактичну основу для осмислення теми. Це можуть бути історичні та сучасні факти, архівні документи, листи, щоденники, спогади, інтерв’ю, фотографії, відеозаписи, аудіозаписи, газетні та журнальні публікації, статистика, біографічні відомості, офіційні документи, музейні предмети, артефакти, іконографічні матеріали, матеріали з конкретного місця або середовища.\\n\\nДокументальний матеріал не слід просто накопичувати. Кожен знайдений факт або документ потрібно осмислювати з позиції майбутньої постановки: що він відкриває в темі, яку суперечність виявляє, який образ або епізод може народити, чи може стати основою тексту, відеофрагмента, сценічної дії або монтажного зіставлення.\\n\\nРежисер може проводити і власне дослідження: записувати інтерв’ю, фотографувати місце, працювати з архівами, музеями, приватними колекціями, збирати усні історії та свідчення. Відібрані факти і документи надалі можуть бути образно переосмислені і перетворені на факти мистецтва: драматургію, сценарний хід, сценічний образ, персонажа, звук, відео або інший художній засіб.\\n\\nДо кожного матеріалу обов’язково залишайте режисерську нотатку: як саме його можна використати або з чим його можна поєднати."},{"id":"artisticMaterials","type":"material_collection","collectionKind":"artistic","title":"1.3.2. Художній матеріал","help":"Збирайте твори та фрагменти мистецтва, які можуть стати змістовим, образним, музичним, пластичним або візуальним матеріалом майбутнього проєкту.","theory":"Художній матеріал уже є результатом мистецького осмислення дійсності. До нього належать літературні твори, поезія, драматургія, музика, пісні, кінематограф, фотографія, живопис, хореографія, сценічні номери, вистави, сценографія, костюм, звукові та відеоматеріали, а також інші твори різних видів мистецтва.\\n\\nСценарний матеріал великого видовищного проєкту може бути художнім, літературним, образотворчим, звуковим і музичним. Джерелом можуть стати як цілі твори, так і окремі фрагменти, образи, мотиви, фактури, ритми, інтонації, принципи побудови або режисерські прийоми.\\n\\nВажливо не копіювати знайдене рішення, а зрозуміти, що саме в ньому вас цікавить. Це може бути музична тема, спосіб появи виконавця, пластичний принцип, колір, композиція кадру, характер монтажу, сценографічний образ, контраст, ритм або спосіб взаємодії з глядачем.\\n\\nДо кожного художнього матеріалу фіксуйте, що саме вас зацікавило і як цей матеріал може працювати у вашому проєкті: стати основою епізоду, створити атмосферу, вступити в контраст із документом, підказати образ, просторове рішення або принцип монтажу."},{"id":"directorNotebook","type":"material_collection","collectionKind":"notes","title":"1.3.3. Режисерський блокнот","help":"Фіксуйте ідеї одразу, коли вони виникають. Тут можуть з’являтися образи, монтажні зв’язки, просторові рішення, питання, музичні та візуальні задуми.","theory":"Режисерський блокнот потрібен для того, щоб не втрачати думки, які виникають під час дослідження. Не кожна ідея одразу належить до конкретного документа чи твору. Іноді спочатку з’являється образ, фраза, ритм, спосіб переходу між епізодами, поєднання двох матеріалів або питання, на яке ще немає відповіді.\\n\\nФіксуйте такі думки одразу. Вони не зобов’язані бути остаточними або правильними. Це робочий простір режисера. Тут можна записати, як поєднати архівний документ із музикою, яким може бути пролог, який предмет може стати образом, де використати тишу, як змінити простір, як підвести глядача до певного переживання.\\n\\nОсобливо важливо фіксувати зв’язки між матеріалами. Саме в таких зв’язках часто починає народжуватися монтаж, епізод, сценарно-режисерський хід або майбутній художній образ."}]};\nfunction dlUpgradeSchema(raw){const x=JSON.parse(JSON.stringify(raw||{}));x.sections=[JSON.parse(JSON.stringify(DIRECTING_LAB_JUSTIFICATION_SECTION)),JSON.parse(JSON.stringify(DIRECTING_LAB_PROJECT_PARAMETERS_SECTION)),JSON.parse(JSON.stringify(DIRECTING_LAB_RESEARCH_SECTION))];x.contentVersion=Math.max(6,Number(x.contentVersion||0));return x}\n\nconst DIRECTING_LAB_DEFAULT_SCHEMA={\n  version:1,\n  contentVersion:3,\n  title:"Режисерська лабораторія",\n  subtitle:"Індивідуальна траєкторія розробки режисерського проєкту",\n  sections:[\n    {id:"passport",title:"1. Паспорт проєкту",intro:"Це стартова картка майбутнього проєкту. Визнач робочу назву, форму та коротко сформулюй задум. Теоретичний матеріал і приклади до цього розділу викладач поступово доповнюватиме.",published:true,blocks:[\n      {id:"projectTitle",type:"text",title:"Робоча назва проєкту",help:"Назва може бути робочою і змінюватися в процесі.",placeholder:"Введи робочу назву",required:true},\n      {id:"format",type:"text",title:"Форма / жанр",help:"Визнач сценічну форму або жанрову природу задуму.",placeholder:"Наприклад: музично-сценічний перформанс",required:false},\n      {id:"concept",type:"textarea",title:"Коротка концепція",help:"Стисло опиши, що саме ти хочеш створити і чому цей задум важливий.",placeholder:"2–5 абзаців",required:false}\n    ]},\n    DIRECTING_LAB_JUSTIFICATION_SECTION,\n    {id:"dramaturgy",title:"2. Драматургічна основа",intro:"У цьому розділі формується смислова й драматургічна основа майбутнього проєкту. Перед заповненням окремих пунктів ознайомся з теоретичним матеріалом до розділу.",published:true,blocks:[\n      {id:"theme",type:"textarea",title:"Тема",help:"Сформулюй предмет художнього осмислення.",placeholder:"Тема проєкту",required:false},\n      {id:"idea",type:"textarea",title:"Ідея",help:"Сформулюй основну авторську думку, до якої має привести проєкт.",placeholder:"Ідея проєкту",required:false},\n      {id:"problem",type:"textarea",title:"Проблематика",help:"Які питання та суперечності досліджує проєкт?",placeholder:"Проблематика",required:false},\n      {id:"conflict",type:"textarea",title:"Конфлікт",help:"Опиши головне зіткнення сил, позицій або цінностей.",placeholder:"Конфлікт",required:false},\n      {id:"structure",type:"textarea",title:"Архітектоніка / структура",help:"Опиши великі частини, епізоди або логіку розвитку дії.",placeholder:"Структура проєкту",required:false}\n    ]},\n    {id:"director",title:"3. Режисерський задум",intro:"Розділ переводить драматургічну основу у мову режисури: образ, спосіб сценічного існування, прийоми та систему виразних засобів.",published:true,blocks:[\n      {id:"directorConcept",type:"textarea",title:"Режисерський задум",help:"Опиши, яким способом задум буде втілено на сцені.",placeholder:"Режисерський задум",required:false},\n      {id:"image",type:"textarea",title:"Образ проєкту",help:"Сформулюй центральний образ або образну систему.",placeholder:"Образне рішення",required:false},\n      {id:"techniques",type:"textarea",title:"Режисерські прийоми та засоби виразності",help:"Переліч і поясни прийоми, які працюватимуть на задум.",placeholder:"Прийоми, монтаж, пластика, взаємодія з глядачем…",required:false}\n    ]},\n    {id:"staging",title:"4. Постановочне рішення",intro:"Тут задум конкретизується через простір, мізансцену, сценографію, світло, звук, відео та темпоритм.",published:true,blocks:[\n      {id:"space",type:"textarea",title:"Простір і мізансценування",help:"Опиши принцип організації сценічного простору та руху.",placeholder:"Просторове рішення",required:false},\n      {id:"visual",type:"textarea",title:"Сценографія / візуальне рішення",help:"Опиши візуальну систему проєкту.",placeholder:"Сценографія, костюм, графіка…",required:false},\n      {id:"tech",type:"textarea",title:"Світло, звук, відео",help:"Які технічні засоби є частиною режисерського рішення?",placeholder:"Технічне рішення",required:false},\n      {id:"rhythm",type:"textarea",title:"Темпоритм",help:"Опиши принцип темпоритмічної побудови.",placeholder:"Темпоритм",required:false}\n    ]},\n    {id:"plan",title:"5. Режисерсько-постановочний план",intro:"Фінальний робочий розділ збирає матеріал у постановочну документацію. Тут можуть з’являтися таблиці, шаблони й файли, які викладач додаватиме поступово.",published:true,blocks:[\n      {id:"plan",type:"textarea",title:"Постановочний план / послідовність епізодів",help:"Опиши або встав структуру постановочного плану.",placeholder:"План",required:false},\n      {id:"links",type:"link",title:"Робочі посилання",help:"Додай посилання на сценарій, Canva, відео, референси або інші матеріали.",placeholder:"https://…",required:false}\n    ]}\n  ]\n};\nconst dlFeedbackStatusLabels={draft:"Чернетка",submitted:"Подано",revision:"Доопрацювати",approved:"Погоджено"};\nconst dlStatusLabel={not_started:"Не розпочато",in_progress:"У роботі",review:"На перевірці",revision:"Доопрацювання",approved:"Погоджено"};\nconst dlBlockTypeLabels={text:"Коротка відповідь",textarea:"Велике текстове поле",table:"Таблиця",file:"Файл / документ",link:"Посилання",checklist:"Чекліст",theory:"Матеріал / приклад",material_collection:"Колекція матеріалів"};\n\nconst DIRECTING_LAB_REMS34_NAMES=[\n  "Баленко Ілля","Вознюк Олександра","Волошина Дар’я","Давидова Світлана","Данільчук Катерина",\n  "Дубина Віолетта","Карпенко Рімма","Кириленко Михайло","Коткова Анастасія","Кропивка Маргарита",\n  "Лещинський Денис","Мороз Марія","Павлова Катерина","Піддубна Марія","Ташута Артем"\n];\nconst dlNormPerson=v=>String(v||"").toLowerCase().replace(/[’\'`ʼ]/g,"").replace(/ґ/g,"г").replace(/\\s+/g," ").trim();\nconst DIRECTING_LAB_REMS34_KEYS=new Set(DIRECTING_LAB_REMS34_NAMES.map(dlNormPerson));\n\n// v44.9: персональні папки Google Drive для індивідуальних лабораторій, включно з Максімовою та Мостовою.\n// Ключі дублюються у повній та короткій формі, щоб зіставлення не залежало від по батькові / апострофів.\nconst DIRECTING_LAB_PERSONAL_DRIVE_ENTRIES=[\n  ["Баленко Ілля","https://drive.google.com/drive/folders/1k4qJ0kU1tkhRW4C66HV7oPT3iE3MXLwM"],\n  ["Вознюк Олександра","https://drive.google.com/drive/folders/18PTitSgloN_PgQ12EZkrA5_CTe2SvMtE"],\n  ["Волошина Дар’я","https://drive.google.com/drive/folders/1W0TIbui4mP8p2t0Zoo0yRDnkl0AZPU6p"],\n  ["Давидова Світлана","https://drive.google.com/drive/folders/1QLiJuXQD-DdykFxkHMQR5KxZKpdU3Qd3"],\n  ["Данільчук Катерина","https://drive.google.com/drive/folders/1Q-4BsG67rdyBtz8xrRmeJyPcrfhqHB2W"],\n  ["Дубина Віолетта","https://drive.google.com/drive/folders/1S2kanJP53Sk50po1mFy9yikZbOSQ95mv"],\n  ["Карпенко Рімма","https://drive.google.com/drive/folders/1oCoCpxOtFzRwRQM9dL14l2C7qdkNo6Ru"],\n  ["Кириленко Михайло","https://drive.google.com/drive/folders/1VlD2rzr2Gf0E2n8A054qooWkOLr3jg_P"],\n  ["Коткова Анастасія","https://drive.google.com/drive/folders/1H9qiz6ySQ5XpXs-rhs_opMnw05-YLWjJ"],\n  ["Кропивка Маргарита","https://drive.google.com/drive/folders/1d3HzS7ffIAYU8LY9pMbggXvSfm2rdvuN"],\n  ["Лещинський Денис","https://drive.google.com/drive/folders/19JMX6sIJSK3nkU6LQq46nqhwccLms5d8"],\n  ["Мороз Марія","https://drive.google.com/drive/folders/1qNOFpOElj5YePW1rQyt5tPtSecnqzykI"],\n  ["Павлова Катерина","https://drive.google.com/drive/folders/1LqLCmLMesOiqEofb2J17gWRm6JgEWRY9"],\n  ["Піддубна Марія","https://drive.google.com/drive/folders/1cy3fi0iri0fZOXBap0ZSpQSir664bZK0"],\n  ["Ташута Артем","https://drive.google.com/drive/folders/17dR9qkcESksSu7c5-s-TquGuLRESwLXQ"],\n  ["Вінцюк Андрій Олександрович","https://drive.google.com/drive/folders/14lS1-EnkxZOm-oTaVojaSErlfeC61a1X"],\n  ["Власенко Дар`я Андріївна","https://drive.google.com/drive/folders/1XwXD7tcO3PEI9DWjuhYLg5QASuATdfnY"],\n  ["Гострик Катерина Юріївна","https://drive.google.com/drive/folders/1JIURnH1K2uarPkrRIruyGI_rJuy8yt5-"],\n  ["Жолуденко Поліна Ігорівна","https://drive.google.com/drive/folders/1B-cEkOTwwW0DjnHO1qdxm-k4FLpkc4X split(" ").filter(Boolean);return DIRECTING_LAB_PERSONAL_DRIVE_MAP.get(full)||DIRECTING_LAB_PERSONAL_DRIVE_MAP.get(p.slice(0,2).join(" "))||""}\nfunction dlLegacyProjectDriveForStudent(st,url){const u=String(url||"").trim();if(!u)return false;return dlProjectsForStudent(st).some(p=>String(p?.driveUrl||"").trim()===u)}\nfunction dlIsNamedRems34(st){const full=dlNormPerson(st?.name||"");if(DIRECTING_LAB_REMS34_KEYS.has(full))return true;const parts=full.split(" ").filter(Boolean);return parts.length>=2&&DIRECTING_LAB_REMS34_KEYS.has(`${parts[0]} ${parts[1]}`)}\nfunction dlStudentGroup(st){const raw=String(studentGroupLabel(st)||st?.group||"").toUpperCase().replace(/\\s+/g,"");if(raw.includes("РЕМС-44")||raw.includes("REMS-44"))return"44";if(dlIsNamedRems34(st))return"34";return""}\nfunction dlEligibleStudents(){return(db.students||[]).filter(st=>["34","44"].includes(dlStudentGroup(st))).slice().sort((a,b)=>dlStudentGroup(b).localeCompare(dlStudentGroup(a))||String(a.name||"").localeCompare(String(b.name||""),"uk"))}\nfunction dlLabId(studentId){return`dl-${String(studentId)}`}\nfunction dlLabForStudent(studentId){db[DIRECTING_LABS_KEY]=Array.isArray(db[DIRECTING_LABS_KEY])?db[DIRECTING_LABS_KEY]:[];return db[DIRECTING_LABS_KEY].find(x=>String(x.studentId)===String(studentId))||null}\nfunction dlProjectsForStudent(studentOrId){\n  const st=(studentOrId&&typeof studentOrId==="object")?studentOrId:(db.students||[]).find(s=>String(s.id)===String(studentOrId));\n  const sid=String(st?.id??studentOrId??"");\n  const studentName=dlNormPerson(st?.name||"");\n  const compactName=v=>{const parts=dlNormPerson(v).split(" ").filter(Boolean);return parts.slice(0,2).join(" ")};\n  const studentShort=compactName(st?.name||"");\n  return(largeFormsCache||[]).filter(x=>{\n    if(sid&&lfAuthorIds(x).includes(sid))return true;\n    if(!studentName)return false;\n    const authorNames=lfAuthorNames(x);\n    return authorNames.some(name=>{\n      const full=dlNormPerson(name),short=compactName(name);\n      return full===studentName||(studentShort&&short===studentShort);\n    });\n  });\n}\nasync function ensureDirectingLabs(){db[DIRECTING_LABS_KEY]=Array.isArray(db[DIRECTING_LABS_KEY])?db[DIRECTING_LABS_KEY]:[];const byStudent=new Map(db[DIRECTING_LABS_KEY].map(x=>[String(x.studentId),x]));const now=new Date().toISOString();let changed=false;for(const st of dlEligibleStudents()){const sid=String(st.id),personalDrive=dlPersonalDriveForStudent(st);let lab=byStudent.get(sid);if(!lab){lab={id:dlLabId(sid),studentId:sid,status:"not_started",createdAt:now,updatedAt:now,driveUrl:personalDrive||""};db[DIRECTING_LABS_KEY].push(lab);byStudent.set(sid,lab);changed=true}else if(personalDrive&&(!String(lab.driveUrl||"").trim()||dlLegacyProjectDriveForStudent(st,lab.driveUrl))){lab.driveUrl=personalDrive;lab.updatedAt=now;changed=true}}if(changed){cache();if(cloudDb&&cloudReady&&currentUser){try{await setDoc(doc(cloudDb,"rems_control",CLOUD_DOC),{[DIRECTING_LABS_KEY]:clone(db[DIRECTING_LABS_KEY]),updatedAt:now},{merge:true})}catch(err){console.error("Directing labs persist failed",err)}}}}\nfunction dlProjectOwnershipText(project){const names=lfAuthorNames(project);return names.length<=1?"Індивідуальний проєкт":`Спільний проєкт · ${names.length} автори`}\nfunction dlPhotoOrInitial(st,detail=false){const photo=sharedStudentPhoto(st);const cls=detail?"dl-detail-photo":"dl-student-photo";if(photo)return`<img class="${cls}" src="${lfEsc(photo)}" alt="${lfEsc(st.name||\'Студент\')}">`;return`<span class="${cls} dl-student-photo-empty">${lfEsc(String(st.name||\'?\').trim().charAt(0)||\'?\')}</span>`}\nconst dlNewId=(prefix="x")=>`${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;\nfunction dlSchemaClone(x){return dlUpgradeSchema(JSON.parse(JSON.stringify(x||DIRECTING_LAB_DEFAULT_SCHEMA)))}\nasync function dlLoadSchema(force=false){if(directingLabSchemaCache&&!force)return directingLabSchemaCache;if(!cloudDb){directingLabSchemaCache=dlUpgradeSchema(DIRECTING_LAB_DEFAULT_SCHEMA);return directingLabSchemaCache}try{const snap=await getDoc(doc(cloudDb,DIRECTING_LAB_SCHEMA_COLLECTION,DIRECTING_LAB_SCHEMA_DOC));directingLabSchemaCache=dlUpgradeSchema(snap.exists()?snap.data():DIRECTING_LAB_DEFAULT_SCHEMA)}catch(e){console.error("Lab schema load",e);directingLabSchemaCache=dlUpgradeSchema(DIRECTING_LAB_DEFAULT_SCHEMA)}return directingLabSchemaCache}\nasync function dlSaveSchema(schema){if(!cloudDb||!currentUser)throw new Error("Потрібен вхід викладача");const clean=dlSchemaClone(schema);clean.updatedAt=new Date().toISOString();clean.updatedBy=currentUser.email||currentUser.uid||"";clean.version=Number(clean.version||0)+1;await setDoc(doc(cloudDb,DIRECTING_LAB_SCHEMA_COLLECTION,DIRECTING_LAB_SCHEMA_DOC),clean,{merge:false});directingLabSchemaCache=clean;return clean}\nfunction dlSchemaStats(schema){const sections=(schema?.sections||[]).filter(s=>s.published!==false),blocks=sections.flatMap(s=>s.blocks||[]).filter(b=>b.type!=="theory");return{sections:sections.length,blocks:blocks.length}}\n\nfunction renderDirectingLaboratory(){\n  const all=dlEligibleStudents();const rows=all.filter(st=>directingLabFilter==="all"||dlStudentGroup(st)===directingLabFilter);const counts={"34":all.filter(st=>dlStudentGroup(st)==="34").length,"44":all.filter(st=>dlStudentGroup(st)==="44").length};\n  app.innerHTML=`<div class="lf-toolbar"><div><span class="eyebrow">Індивідуальна робота</span><h2 style="margin:4px 0 3px">Режисерська лабораторія</h2><div class="muted">Живе навчальне середовище: теорія, завдання, таблиці, файли, відгук викладача та персональний Google Drive. Структуру можна доповнювати впродовж семестру без втрати студентських відповідей.</div></div><div class="dl-toolbar-actions"><div class="dl-top-actions"><button class="ghost" id="dlOpenBuilder" type="button">⚙ Конструктор лабораторії</button><button class="primary" id="dlActivateAll" type="button">Активувати лабораторії всім</button></div><div class="lf-tabs"><button class="lf-tab ${directingLabFilter===\'44\'?\'active\':\'\'}" data-dl-filter="44">РЕМС-44 · ${counts[\'44\']}</button><button class="lf-tab ${directingLabFilter===\'34\'?\'active\':\'\'}" data-dl-filter="34">РЕМС-34 · ${counts[\'34\']}</button><button class="lf-tab ${directingLabFilter===\'all\'?\'active\':\'\'}" data-dl-filter="all">Усі · ${all.length}</button></div></div></div>\n  <div class="lf-grid">${rows.map(st=>{const lab=dlLabForStudent(st.id)||{};const projects=dlProjectsForStudent(st.id);const single=projects.filter(p=>lfAuthorIds(p).length===1);const shared=projects.filter(p=>lfAuthorIds(p).length>1);return`<button class="lf-card dl-student-card" data-dl-open="${lfEsc(st.id)}" style="--lf-color:${dlStudentGroup(st)===\'44\'?\'#7c3aed\':\'#2563eb\'}"><div class="dl-card-row">${dlPhotoOrInitial(st)}<div class="dl-card-main"><div class="lf-card-head"><div><div class="lf-meta"><span class="lf-chip">РЕМС-${dlStudentGroup(st)}</span><span class="lf-chip">${lfEsc(dlStatusLabel[lab.status]||dlStatusLabel.not_started)}</span>${lab.driveUrl?\'<span class="lf-chip">☁ Drive</span>\':\'\'}</div><h3>${lfEsc(st.name||\'Студент\')}</h3></div><span>→</span></div><div class="lf-team">${single.length?`Закріплено: <b>${lfEsc(single.map(p=>p.title||\'Без назви\').join(\', \'))}</b>`:shared.length?`Поки спільний проєкт: <b>${lfEsc(shared.map(p=>p.title||\'Без назви\').join(\', \'))}</b>`:\'Індивідуальний проєкт ще не визначено\'}</div></div></div></button>`}).join(\'\')||\'<div class="lf-empty">У контингенті не знайдено студентів РЕМС-34 / РЕМС-44.</div>\'}</div>`;\n  app.querySelectorAll(\'[data-dl-filter]\').forEach(b=>b.onclick=()=>{directingLabFilter=b.dataset.dlFilter;renderDirectingLaboratory()});app.querySelectorAll(\'[data-dl-open]\').forEach(b=>b.onclick=()=>openDirectingLab(b.dataset.dlOpen));const a=app.querySelector(\'#dlActivateAll\');if(a)a.onclick=()=>dlActivateAllStudents(a);app.querySelector(\'#dlOpenBuilder\').onclick=()=>openDirectingLabConstructor();\n}\n\nfunction dlBuilderBlockHtml(block,si,bi){const type=block.type||"textarea";return`<div class="dl-builder-block" data-builder-block data-si="${si}" data-bi="${bi}"><div class="dl-builder-block-head"><b>${bi+1}. ${lfEsc(block.title||\'Новий пункт\')}</b><div><button type="button" class="ghost mini" data-block-up>↑</button><button type="button" class="ghost mini" data-block-down>↓</button><button type="button" class="danger mini" data-block-delete>Видалити</button></div></div><div class="dl-builder-grid"><label>Тип<select data-b="type">${Object.entries(dlBlockTypeLabels).map(([k,v])=>`<option value="${k}" ${type===k?\'selected\':\'\'}>${lfEsc(v)}</option>`).join(\'\')}</select></label><label class="wide">Назва пункту<input data-b="title" value="${lfEsc(block.title||\'\')}"></label><label class="wide">Коротка інструкція біля поля<textarea data-b="help" rows="3">${lfEsc(block.help||\'\')}</textarea></label><label class="wide">Теоретичний матеріал у спливаючому вікні<textarea data-b="theory" rows="8" placeholder="Цей текст студент відкриє кнопкою «Теорія до пункту»">${lfEsc(block.theory||\'\')}</textarea></label><label class="wide">Підказка у полі<input data-b="placeholder" value="${lfEsc(block.placeholder||\'\')}"></label><label class="wide">Посилання на зразок / шаблон<input data-b="templateUrl" value="${lfEsc(block.templateUrl||\'\')}" placeholder="https://…"></label><label class="wide">Колонки таблиці / варіанти чекліста <small>(через |)</small><input data-b="options" value="${lfEsc((block.columns||block.options||[]).join(\' | \'))}" placeholder="Епізод | Зміст | Світло | Звук"></label><label class="dl-check"><input type="checkbox" data-b="required" ${block.required?\'checked\':\'\'}> Обов’язковий пункт</label><label class="dl-check"><input type="checkbox" data-b="wide" ${block.wide?\'checked\':\'\'}> На всю ширину</label></div></div>`}\nfunction dlBuilderSectionHtml(section,si){return`<section class="dl-builder-section" data-builder-section data-si="${si}"><div class="dl-builder-section-head"><div><span class="eyebrow">Розділ ${si+1}</span><h3>${lfEsc(section.title||\'Новий розділ\')}</h3></div><div><button type="button" class="ghost mini" data-section-up>↑</button><button type="button" class="ghost mini" data-section-down>↓</button><button type="button" class="danger mini" data-section-delete>Видалити</button></div></div><div class="dl-builder-grid"><label class="wide">Назва розділу<input data-s="title" value="${lfEsc(section.title||\'\')}"></label><label class="wide">Вступний теоретичний матеріал<textarea data-s="intro" rows="6" placeholder="Вступ до всього розділу, який студент спочатку читає…">${lfEsc(section.intro||\'\')}</textarea></label><label class="dl-check"><input type="checkbox" data-s="published" ${section.published!==false?\'checked\':\'\'}> Опублікований для студентів</label></div><div class="dl-builder-blocks">${(section.blocks||[]).map((b,bi)=>dlBuilderBlockHtml(b,si,bi)).join(\'\')}</div><button type="button" class="ghost" data-add-block>＋ Додати пункт</button></section>`}\nasync function openDirectingLabConstructor(){\n  const schema=dlSchemaClone(await dlLoadSchema(true));\n  const render=()=>{const stats=dlSchemaStats(schema);app.innerHTML=`<div class="dl-builder-page"><div class="lf-detail-head"><div><button class="ghost" id="dlBuilderBack">← До лабораторії</button><span class="eyebrow" style="display:block;margin-top:14px">Конструктор</span><h2 style="margin:4px 0">Структура режисерської лабораторії</h2><p class="muted">Додавай розділи поступово. Опублікований новий розділ з’явиться у всіх студентів за тим самим персональним посиланням; старі відповіді не зникнуть.</p></div><div class="dl-builder-summary"><b>${stats.sections}</b><small>опублікованих розділів</small><b>${stats.blocks}</b><small>робочих пунктів</small></div></div><div id="dlBuilderSections">${(schema.sections||[]).map(dlBuilderSectionHtml).join(\'\')}</div><button class="ghost dl-add-section" id="dlAddSection">＋ Додати розділ</button><
