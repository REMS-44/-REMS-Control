<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <title>Моя режисерська лабораторія</title>
  <link rel="stylesheet" href="lab.css?v=46.2">
</head>
<body>
  <header class="lab-topbar">
    <div class="lab-brand"><span>R</span><div><b>Режисерська лабораторія</b><small>Персональний простір студента</small></div></div>
    <div id="labGroup" class="lab-group"></div>
  </header>
  <main id="labApp"><div class="loading">Завантаження лабораторії…</div></main>
  <script src="firebase-config.js?v=46.2"></script>
  <script src="drive-upload-config.js?v=46.2"></script>
  <script src="jszip.min.js"></script>
  <script>
    window.__REMS_LAB_RENDERED = false;
    window.addEventListener('error', function(e){
      var box=document.getElementById('labApp');
      if(box && box.textContent.indexOf('Завантаження лабораторії')>=0){
        box.innerHTML='<div class="error-card"><b>Не вдалося запустити лабораторію</b><p>'+String(e.message||'Помилка JavaScript')+(e.filename?' · '+e.filename:'')+(e.lineno?' · рядок '+e.lineno:'')+(e.colno?' : '+e.colno:'')+'</p></div>';
      }
    });
    window.addEventListener('unhandledrejection', function(e){
      var box=document.getElementById('labApp');
      if(box && box.textContent.indexOf('Завантаження лабораторії')>=0){
        var msg=(e.reason && (e.reason.message||e.reason)) || 'Невідома помилка';
        box.innerHTML='<div class="error-card"><b>Не вдалося завантажити лабораторію</b><p>'+String(msg)+'</p></div>';
      }
    });
    setTimeout(function(){
      var box=document.getElementById('labApp');
      if(!window.__REMS_LAB_RENDERED && box && box.textContent.indexOf('Завантаження лабораторії')>=0){
        box.innerHTML='<div class="error-card"><b>Лабораторія не завершила завантаження</b><p>Оновіть сторінку. Якщо повідомлення повториться, надішліть цей екран викладачу.</p></div>';
      }
    },12000);
  </script>
  <script type="module" src="lab-v46.2.js?v=46.2"></script>
</body>
</html>
